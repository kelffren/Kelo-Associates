name: Kelo Associates QA
on:
  push:
    branches: [main, roadmap-full-implementation]
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: npm run check
      - name: State smoke test
        run: npm test
